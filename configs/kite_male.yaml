# Echo / kite look sheet — sandbox generate only.
# Ground truth: live LOVE32 disk names + three outfit families.
# Never --deploy / --project into LOVE32. Live already owns Character,
# layeredimage, and _kite_sprite. Copy-only or hand-copy PNGs only.
#
# Disk: kite_male <pose>.png (space). Ren'Py tag: kite_male <pose>.
# crossed_arms is scaled 1.39 in the live script — Echo's display problem,
# not a Matcha generate concern. Still emit kite_male crossed_arms.png.
# angry is not a file; it aliases kite_male stressed.png.
name: kite_male
display_name: Echo
filename_template: "{name} {pose}.png"
# Shared identity only. Outfit families below — one description cannot
# cover apron-bar vs home henley vs withdrawn dark shirt.
description: >-
  1boy, adult man, short buzz-cut brown hair, warm amber eyes, light stubble,
  sharp jaw, visual novel sprite, cel shaded, clean lineart, same face
poses:
  - neutral
  - gentle
  - relaxed
  - smoking
  - soft
  - stressed
  - tired
  - warm
  - withdrawn
  - crossed_arms
pose_aliases:
  angry: stressed
outfit_families:
  apron_bar: >-
    charcoal long-sleeve button-up shirt, dark buckle bartender apron,
    Male New Game bar outfit, no henley, no polo
  home_henley: >-
    olive or charcoal henley or polo shirt, no apron, no bartender outfit,
    no buckle apron
  withdrawn_dark: >-
    oversized dark long-sleeve button shirt, no apron, no bartender outfit,
    no henley, no polo
pose_overrides:
  # 1. Apron / bar — Male New Game bar family
  neutral:
    family: apron_bar
  warm:
    family: apron_bar
  soft:
    family: apron_bar
  stressed:
    family: apron_bar
  tired:
    family: apron_bar
  gentle:
    family: apron_bar
  # 2. Home henley — no apron. Smoking is seated on a ledge with a cigarette.
  relaxed:
    family: home_henley
  smoking:
    family: home_henley
    prompt: seated on a ledge, holding a cigarette, chest-up, relaxed jaw
    extra_negative: bartender apron, buckle apron, bar counter, standing behind a bar
  # 3. Withdrawn dark shirt — crossed_arms is this family, not a fourth.
  withdrawn:
    family: withdrawn_dark
    prompt: withdrawn, looking aside, arms crossed, closed-off, distant
    extra_negative: bartender apron, buckle apron, henley, polo
  crossed_arms:
    family: withdrawn_dark
    prompt: arms crossed over chest, reserved, closed-off
    extra_negative: bartender apron, buckle apron, henley, polo

checkpoint: anythingV5PrtRE.safetensors
lora: null
lora_strength: 0.7
# Trusted first success on Mac MPS: 512×512, --lora none.
# Echo-sized output is opt-in later (--canvas), not a new default.
width: 512
height: 512
steps: 20
seed: 42
consistency_denoise: 1.0
ip_adapter_weight: 0
quality_retries: 2
output_dir: ./sandbox-kite
