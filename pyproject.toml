[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matcha-engine"
version = "0.1.0"
description = "Matcha Engine — AI game asset pipeline: YAML character configs to consistent sprite sets deployed into Ren'Py projects"
requires-python = ">=3.10"
# LICENSE file is absent from the repo root (flagged 2026-11-14). The project
# is intended to be MIT; uncomment once a LICENSE file is added:
# license = {text = "MIT"}
classifiers = [
    # "License :: OSI Approved :: MIT License",  # pending LICENSE file
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.9",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "websocket-client>=1.6",
    "pillow>=10.0",
]

[project.scripts]
matcha = "matcha.cli:app"

[tool.setuptools.packages.find]
include = ["matcha*"]
